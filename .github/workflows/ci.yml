# Controleer elke push en pull request: de Python-code met ruff en alle unittests, met 100% dekking.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittests:
    name: Lint en unittests
    runs-on: ubuntu-latest
    steps:
      # De acties staan vast op een commit, zodat een gewijzigde tag niet ongemerkt andere code laat draaien.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4
        with:
          just-version: 1.58.0
      - name: Lint
        run: just lint
      - name: Unittests
        run: just test
